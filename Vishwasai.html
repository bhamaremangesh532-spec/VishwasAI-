<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VishwasAI – Digital Content Trust Assistant</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eef4ff, #ffffff);
  color: #172033;
  min-height: 100vh;
}

header {
  background: #172b4d;
  color: white;
  padding: 25px 18px;
  text-align: center;
}

.logo {
  font-size: 32px;
  font-weight: bold;
}

.subtitle {
  margin-top: 8px;
  font-size: 15px;
  opacity: 0.9;
}

.container {
  max-width: 850px;
  margin: 25px auto;
  padding: 0 16px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h2 {
  margin-bottom: 15px;
}

.upload-box {
  border: 2px dashed #5b78a6;
  border-radius: 15px;
  padding: 30px 15px;
  text-align: center;
  background: #f7faff;
}

input[type="file"] {
  margin-top: 15px;
  width: 100%;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  margin: 8px 5px 0 0;
  cursor: pointer;
  font-weight: bold;
}

.analyze {
  background: #172b4d;
  color: white;
  width: 100%;
  margin-top: 18px;
}

.lang {
  background: white;
  color: #172b4d;
}

.sample-real {
  background: #dff6e7;
}

.sample-suspicious {
  background: #fff0cf;
}

.sample-ai {
  background: #ffe0e0;
}

.result {
  display: none;
  margin-top: 20px;
  padding: 20px;
  border-radius: 14px;
  background: #fff7df;
  border-left: 6px solid #e3a600;
}

.result h3 {
  margin-bottom: 10px;
}

.signal {
  margin-top: 10px;
  padding: 10px;
  background: #f5f5f5;
  border-radius: 8px;
}

.guidance li {
  margin: 9px 0;
}

.samples {
  text-align: center;
}

.badge {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 20px;
  background: #e9eef8;
  margin-bottom: 10px;
  font-size: 13px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #667085;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🛡️ VishwasAI</div>
  <div class="subtitle">
    Digital Content Trust Assistant
  </div>

  <button class="lang" onclick="toggleLanguage()">
    मराठी / English
  </button>
</header>

<div class="container">

  <div class="card">
    <span class="badge">Responsible AI • Digital
